name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the uploaded ZIP file
      run: |
        unzip -q *.zip -d my_project/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        cd my_project/
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload final APK
      uses: actions/upload-artifact@v4
      with:
        name: HumanitarianAid-App
        path: my_project/app/build/outputs/apk/debug/*.apk
